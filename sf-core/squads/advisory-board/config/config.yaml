# ═══════════════════════════════════════════════════════════════════
# Squad: Advisory Board
# Domain: Strategic Advisory
# Version: 1.0.0
# ═══════════════════════════════════════════════════════════════════

squad:
  name: advisory-board
  display_name: "Advisory Board Squad"
  version: "1.0.0"
  domain: "Strategic Advisory"
  description: |
    A virtual board of the world's most influential strategic thinkers, investors, and
    leadership philosophers. Each advisor brings decades of real-world experience distilled
    into actionable frameworks. From Ray Dalio's principles-based decision making to
    Brene Brown's courage-based leadership.

    This board covers investment strategy, mental models, network intelligence, scaling,
    purpose-driven leadership, team dynamics, minimalist entrepreneurship, and mission-driven
    business. Four advisory domains: financial, entrepreneurial, organizational, and philosophical.
  keywords: [strategy, investment, leadership, mental-models, scaling, purpose, teams, entrepreneurship, culture, decision-frameworks]
  entry_agent: board-chair
  created_at: "2026-03-05"

tiers:
  tier_0:
    name: "Orchestration"
    agents: [board-chair]
    purpose: "Triage, routing, quality control, advisory session facilitation, decision tracking"
  tier_1_similar:
    name: "Similar Group — Pensam como o CEO"
    agents: [charlie-munger, naval-ravikant, ray-dalio, peter-thiel, alex-hormozi]
    purpose: "Analytical, systems-thinkers, direct, independent. Reforçam e refinam o raciocínio do CEO."
    match_profile: "DC DISC | 5w6 Eneagrama | INTJ MBTI"
  tier_1_contrarian:
    name: "Contrarian Group — Desafiam a visão do CEO"
    agents: [simon-sinek, brene-brown, patrick-lencioni, derek-sivers, reid-hoffman, yvon-chouinard]
    purpose: "People-focused, purpose-driven, vulnerability, simplicity. Contraponto necessário para decisões completas."
    challenge_areas: "Propósito, pessoas, vulnerabilidade, simplicidade, rede, missão"

agents:
  board-chair:       { file: agents/board-chair.md, tier: 0, icon: "🏛️", focus: "Triage, routing, advisory facilitation, decision tracking" }
  # Similar Group
  charlie-munger:    { file: agents/charlie-munger.md, tier: 1, group: similar, icon: "🧠", focus: "Mental models, inversion, cognitive bias" }
  naval-ravikant:    { file: agents/naval-ravikant.md, tier: 1, group: similar, icon: "⚡", focus: "Wealth creation, leverage, first principles" }
  ray-dalio:         { file: agents/ray-dalio.md, tier: 1, group: similar, icon: "📈", focus: "Principles-based decisions, risk management" }
  peter-thiel:       { file: agents/peter-thiel.md, tier: 1, group: similar, icon: "🚀", focus: "Contrarian thinking, monopoly, zero to one" }
  alex-hormozi:      { file: agents/alex-hormozi.md, tier: 1, group: similar, icon: "💰", focus: "Offers, scaling, $100M business building" }
  # Contrarian Group
  simon-sinek:       { file: agents/simon-sinek.md, tier: 1, group: contrarian, icon: "🎯", focus: "Purpose-driven leadership, infinite game" }
  brene-brown:       { file: agents/brene-brown.md, tier: 1, group: contrarian, icon: "💛", focus: "Vulnerability, courage, trust" }
  patrick-lencioni:  { file: agents/patrick-lencioni.md, tier: 1, group: contrarian, icon: "👥", focus: "Team health, organizational dysfunction" }
  derek-sivers:      { file: agents/derek-sivers.md, tier: 1, group: contrarian, icon: "🎵", focus: "Minimalist entrepreneurship, contrarian simplicity" }
  reid-hoffman:      { file: agents/reid-hoffman.md, tier: 1, group: contrarian, icon: "🌐", focus: "Network effects, blitzscaling" }
  yvon-chouinard:    { file: agents/yvon-chouinard.md, tier: 1, group: contrarian, icon: "🏔️", focus: "Mission-driven business, environmental activism" }

handoffs:
  board-chair: { routes_to: [charlie-munger, naval-ravikant, ray-dalio, peter-thiel, alex-hormozi, simon-sinek, brene-brown, patrick-lencioni, derek-sivers, reid-hoffman, yvon-chouinard] }
  charlie-munger: { escalates_to: [board-chair] }
  naval-ravikant: { escalates_to: [board-chair] }
  ray-dalio: { escalates_to: [board-chair] }
  peter-thiel: { escalates_to: [board-chair] }
  alex-hormozi: { escalates_to: [board-chair] }
  simon-sinek: { escalates_to: [board-chair] }
  brene-brown: { escalates_to: [board-chair] }
  patrick-lencioni: { escalates_to: [board-chair] }
  derek-sivers: { escalates_to: [board-chair] }
  reid-hoffman: { escalates_to: [board-chair] }
  yvon-chouinard: { escalates_to: [board-chair] }

# Thematic panels
panels:
  investment_committee:
    advisors: [ray-dalio, charlie-munger, naval-ravikant]
    use_when: "Major financial decision, capital allocation"
  scaling_council:
    advisors: [reid-hoffman, peter-thiel, alex-hormozi]
    use_when: "Growth strategy, when/how to scale"
  culture_circle:
    advisors: [patrick-lencioni, brene-brown, simon-sinek]
    use_when: "Team problems, trust, organizational health"
  offers_clinic:
    advisors: [alex-hormozi, naval-ravikant, peter-thiel]
    use_when: "Offer creation/review, pricing, value equation"
  founder_council:
    advisors: [naval-ravikant, derek-sivers, yvon-chouinard]
    use_when: "Founder at crossroads, life-business alignment"

# Decision tracking
decision_tracking:
  enabled: true
  log_file: data/decision-log.yaml
  ceo_profile: config/ceo-profile.yaml
  follow_up_default_days: 30
  review_frequency: monthly

cross_cutting:
  quality_standards: { min_score: 7.0 }

settings:
  activation:
    prefix: "advisory-board"
    example: "@advisory-board"
    claude_code_skill: "AIOS:agents:advisory-board"
